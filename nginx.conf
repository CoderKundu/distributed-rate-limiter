worker_processes auto;

events {
  worker_connections 4096;
}

http {
  access_log off;

  upstream throttle {
    # plain round robin so a burst gets spread over all three instances,
    # which is the whole point of the accuracy test
    server app1:3000;
    server app2:3000;
    server app3:3000;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://throttle;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
